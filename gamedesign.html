<body>

    <div class="image-grid">
        <img class="modal-img"
            src="images/Lady's Knight Poster.png"
            alt="Lady's Knight Poster"
            data-title="Lady's Knight"
            data-description="A cozy, two player platformer!"
            style="width: 85%"

            src="images/Out of Bounds Studio.png"

    <div id="modal" class="modal">

</body>
    <script>
            const modal = document.getElementById("modal");
            const modalImg = document.getElementById("modal-image");
            const caption = document.getElementById("modal-caption");
            const closeBtn = document.querySelector(".close");

            document.querySelectorAll(".modal-img").forEach(img => 
            {
            img.addEventListener("click", () => {
                modal.style.display = "block";
                modalImg.src = img.src;

                const title = img.dataset.title || img.alt;
                const description = img.dataset.description || "";

                caption.innerHTML = `
                <h2>${title}</h2>
                <p>${description}</p>
                `;
                document.body.style.overflow = "hidden";
            });
        });

        closeBtn.onclick = () => 
        {
        modal.style.display = "none";
        document.body.style.overflow = "";
        };

        modal.onclick = (e) => 
        {
        if (e.target === modal) {
            modal.style.display = "none";
            document.body.style.overflow = "";
        }
    };
    </script>
</html>
