<body>

        <div class="header-right">

    <h1 style="color: #30030B">Digital Art</h1>
    <br>

    <div class="image-grid">
        <img class="modal-img"
            src="images/Portfolio Pictures/Digital Art/HollowKnight-Diebenkorn.png"
            alt="Hollow Knight X Richard Diebenkorn Collage"
            data-title="Hollow Knight X Richard Diebenkorn"
            data-description="Originally a traditional collage, then colored using Photoshop">

        <img class="modal-img"
            src="images/Portfolio Pictures/Digital Art/Medium Man.jpg"
            alt="Medium Man Collage"
            data-title="Medium Man"
            data-description="A Photoshop collage">
    </div>

    <br>
    <br>

    <div class="image-grid">
        <img class="modal-img"
            src="images/Small Life Cover.png"
            alt="Small Life Magazine"
            data-title="Small Life Magazine"
            data-description="A magazine about making miniature models"
            style="width: 50%"
            style="align-items:center"
            >
    </div>

    <div id="modal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modal-image">
        <div class="caption" id="modal-caption"></div>
    </div>

    <!-- Footer -->
    <footer>
        <footer>
        <br>
        <br>
        <p style="background-color: #30030B">Jazmine Cratty<br>
        
        <br>
        <br>

        <a href="mailto:jcratty09@gmail.com">
            <button class="footerButton">jcratty09@gmail.com</button>

    </footer>

</body>
    <script>
            const modal = document.getElementById("modal");
            const modalImg = document.getElementById("modal-image");
            const caption = document.getElementById("modal-caption");
            const closeBtn = document.querySelector(".close");

            document.querySelectorAll(".modal-img").forEach(img => 
            {
            img.addEventListener("click", () => {
                modal.style.display = "block";
                modalImg.src = img.src;

                const title = img.dataset.title || img.alt;
                const description = img.dataset.description || "";

                caption.innerHTML = `
                <h2>${title}</h2>
                <p>${description}</p>
                `;
                document.body.style.overflow = "hidden";
            });
        });

        closeBtn.onclick = () => 
        {
        modal.style.display = "none";
        document.body.style.overflow = "";
        };

        modal.onclick = (e) => 
        {
        if (e.target === modal) {
            modal.style.display = "none";
            document.body.style.overflow = "";
        }
    };
    </script>
</html>
